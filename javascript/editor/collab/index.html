<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dagenda Editor</title>
  <script>
    // Before first paint, so a chosen theme doesn't flash the other one
    try {
      const theme = localStorage.getItem("dagenda-editor:theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header>
    <h1>dagenda</h1>
    <span id="connection">connecting…</span>
    <span id="sync"></span>
    <a id="share" href="" title="Share this link to edit together"></a>
    <span id="people" aria-label="Who's here"></span>
    <!-- include src/header-end.html -->
  </header>

  <!-- include src/panes.html -->

  <script type="module" src="/src/collab.js"></script>
</body>
</html>
