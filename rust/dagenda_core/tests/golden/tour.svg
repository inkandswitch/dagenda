<svg xmlns="http://www.w3.org/2000/svg" class="dagenda tech-tree" viewBox="0 0 896 570" width="896" height="570" font-family="system-ui, sans-serif" font-size="13">
<style>
.dagenda .canvas { fill: #fff; }
.dagenda text { fill: #1d1c1a; }
.dagenda .title { font-size: 18px; font-weight: 650; }
.dagenda .band { fill: #f6f5f2; }
.dagenda .odd .band { fill: #efede8; }
.dagenda .heading { fill: #6b6760; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
.dagenda .edge { fill: none; stroke: #9a958c; stroke-width: 1.5; }
.dagenda .edge.met { stroke: #6aa56f; }
.dagenda .edge.wanted { stroke-dasharray: 5 4; }
.dagenda .arrow { fill: #9a958c; }
.dagenda .card { fill: #fff; stroke: #c9c4bb; stroke-width: 1.25; }
.dagenda .box { fill: #fff; stroke: #8a857c; stroke-width: 1.25; }
.dagenda .mark { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
.dagenda .caption { fill: #6b6760; }
.dagenda .done .card { fill: #edf6ed; stroke: #6aa56f; }
.dagenda .done .box { fill: #6aa56f; stroke: #6aa56f; }
.dagenda .done .mark { fill: #fff; }
.dagenda .in-progress .card { stroke: #2f6fd6; stroke-width: 2; }
.dagenda .in-progress .mark { fill: #2f6fd6; }
.dagenda .needs-attention .card { fill: #fdeeee; stroke: #d33; stroke-width: 2; }
.dagenda .needs-attention .mark { fill: #d33; }
.dagenda .idea .card { stroke-dasharray: 5 3; }
.dagenda .research .card { stroke: #8a5cc8; stroke-dasharray: 2 3; stroke-width: 1.75; }
.dagenda .research .mark { fill: #8a5cc8; }
.dagenda .deferred { opacity: 0.6; }
.dagenda .dropped { opacity: 0.45; }
.dagenda .dropped .label { text-decoration: line-through; }
.dagenda .gate { fill: #fff8e1; stroke: #c9a227; stroke-width: 1.75; }
.dagenda .milestone .label { font-weight: 650; }
.dagenda .reached .gate { fill: #f3d36b; stroke: #a8841a; }
@media (prefers-color-scheme: dark) {
  .dagenda:not(.light) .canvas { fill: #1a1917; }
  .dagenda:not(.light) text { fill: #ecebe8; }
  .dagenda:not(.light) .band { fill: #23221f; }
  .dagenda:not(.light) .odd .band { fill: #2a2925; }
  .dagenda:not(.light) .heading, .dagenda:not(.light) .caption { fill: #9a958c; }
  .dagenda:not(.light) :is(.card, .box) { fill: #1f1e1c; }
  .dagenda:not(.light) :is(.not-started, .idea, .deferred, .dropped) :is(.card, .box), .dagenda:not(.light) :is(.in-progress, .research) .box { stroke: #5b574f; }
  .dagenda:not(.light) .done .card { fill: #1f2e20; }
  .dagenda:not(.light) .done .box { fill: #6aa56f; }
  .dagenda:not(.light) .needs-attention .box { stroke: #e5615a; }
  .dagenda:not(.light) .needs-attention .card { fill: #3a1f1f; stroke: #e5615a; }
  .dagenda:not(.light) .gate { fill: #3a3218; stroke: #c9a227; }
  .dagenda:not(.light) .reached .gate { fill: #8a6d16; }
}
.dagenda.dark .canvas { fill: #1a1917; }
.dagenda.dark text { fill: #ecebe8; }
.dagenda.dark .band { fill: #23221f; }
.dagenda.dark .odd .band { fill: #2a2925; }
.dagenda.dark .heading, .dagenda.dark .caption { fill: #9a958c; }
.dagenda.dark :is(.card, .box) { fill: #1f1e1c; }
.dagenda.dark :is(.not-started, .idea, .deferred, .dropped) :is(.card, .box), .dagenda.dark :is(.in-progress, .research) .box { stroke: #5b574f; }
.dagenda.dark .done .card { fill: #1f2e20; }
.dagenda.dark .done .box { fill: #6aa56f; }
.dagenda.dark .needs-attention .box { stroke: #e5615a; }
.dagenda.dark .needs-attention .card { fill: #3a1f1f; stroke: #e5615a; }
.dagenda.dark .gate { fill: #3a3218; stroke: #c9a227; }
.dagenda.dark .reached .gate { fill: #8a6d16; }
</style>
<defs><marker id="dagenda-arrow" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="canvas" width="896" height="570"/>
<text class="title" x="16" y="34">A tour of the notation</text>
<g class="lane even" data-lane="0"><rect class="band" x="0" y="50" width="896" height="86"/><text class="heading" x="16" y="67">Milestones</text></g>
<g class="lane odd" data-lane="1" data-track="core"><rect class="band" x="0" y="142" width="896" height="86"/><text class="heading" x="16" y="159">Core</text></g>
<g class="lane even" data-lane="2" data-track="views"><rect class="band" x="0" y="234" width="896" height="243"/><text class="heading" x="28" y="251">Views [nested]</text></g>
<g class="lane odd" data-lane="3"><rect class="band" x="0" y="483" width="896" height="71"/><text class="heading" x="16" y="500">Other tasks</text></g>
<path class="edge met" data-from="parser" data-to="resolver" d="M96,184 C175,184 176,192 255,192" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting" data-from="resolver" data-to="itParses" d="M380,192 C420,192 390,100 430,100" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting" data-from="techTree" data-to="firstPicture" d="M707,276 C747,276 717,100 757,100" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting wanted" data-from="skillTree" data-to="firstPicture" d="M111,276 C434,276 434,100 757,100" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting" data-from="itParses" data-to="techTree" d="M553,100 C593,100 563,276 603,276" marker-end="url(#dagenda-arrow)"/>
<g class="node task done" data-id="parser" data-status="done">
<title>Parser (parser): done</title>
<rect class="card" x="16" y="168" width="80" height="33" rx="6"/>
<rect class="box" x="26" y="179" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="189" text-anchor="middle">x</text>
<text class="label" text-anchor="start"><tspan x="45" y="189">Parser</tspan></text>
</g>
<g class="node task in-progress" data-id="resolver" data-status="in-progress">
<title>Resolver (resolver): in progress</title>
<rect class="card" x="261" y="168" width="119" height="48" rx="6"/>
<rect class="box" x="271" y="179" width="12" height="12" rx="2"/>
<text class="mark" x="277" y="189" text-anchor="middle">-</text>
<text class="label" text-anchor="start"><tspan x="290" y="189">Resolver</tspan></text>
<text class="caption" x="290" y="204" text-anchor="start" font-size="11">1 of 2 subtasks</text>
</g>
<g class="node task not-started" data-id="techTree" data-status="not-started">
<title>Tech tree (techTree): not started</title>
<rect class="card" x="609" y="260" width="98" height="33" rx="6"/>
<rect class="box" x="619" y="271" width="12" height="12" rx="2"/>
<text class="label" text-anchor="start"><tspan x="638" y="281">Tech tree</tspan></text>
</g>
<g class="node task idea" data-id="skillTree" data-status="idea">
<title>Skill tree (skillTree): an idea</title>
<rect class="card" x="16" y="260" width="95" height="33" rx="6"/>
<rect class="box" x="26" y="271" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="281" text-anchor="middle">?</text>
<text class="label" text-anchor="start"><tspan x="45" y="281">Skill tree</tspan></text>
</g>
<g class="node task research" data-id="layout" data-status="research">
<title>Layout research (layout): research</title>
<rect class="card" x="16" y="303" width="140" height="33" rx="6"/>
<rect class="box" x="26" y="314" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="324" text-anchor="middle">*</text>
<text class="label" text-anchor="start"><tspan x="45" y="324">Layout research</tspan></text>
</g>
<g class="node task needs-attention" data-id="fonts" data-status="needs-attention">
<title>Fonts (fonts): needs attention</title>
<rect class="card" x="16" y="346" width="75" height="33" rx="6"/>
<rect class="box" x="26" y="357" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="367" text-anchor="middle">!</text>
<text class="label" text-anchor="start"><tspan x="45" y="367">Fonts</tspan></text>
</g>
<g class="node task deferred" data-id="gantt" data-status="deferred">
<title>Gantt (gantt): deferred</title>
<rect class="card" x="16" y="389" width="73" height="33" rx="6"/>
<rect class="box" x="26" y="400" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="410" text-anchor="middle">&gt;</text>
<text class="label" text-anchor="start"><tspan x="45" y="410">Gantt</tspan></text>
</g>
<g class="node task dropped" data-id="mermaid" data-status="dropped">
<title>Mermaid export (mermaid): dropped</title>
<rect class="card" x="16" y="432" width="135" height="33" rx="6"/>
<rect class="box" x="26" y="443" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="453" text-anchor="middle">~</text>
<text class="label" text-anchor="start"><tspan x="45" y="453">Mermaid export</tspan></text>
</g>
<g class="node task not-started" data-id="untracked" data-status="not-started">
<title>A task outside any track (untracked): not started</title>
<rect class="card" x="16" y="509" width="189" height="33" rx="6"/>
<rect class="box" x="26" y="520" width="12" height="12" rx="2"/>
<text class="label" text-anchor="start"><tspan x="45" y="530">A task outside any track</tspan></text>
</g>
<g class="node milestone" data-id="itParses">
<title>It parses (itParses)</title>
<polygon class="gate" points="446,76 543,76 553,100 543,124 446,124 436,100"/>
<text class="label" text-anchor="middle"><tspan x="494" y="97">It parses</tspan></text>
<text class="caption" x="494" y="112" text-anchor="middle" font-size="11">1 of 2 · EOY26</text>
</g>
<g class="node milestone" data-id="firstPicture">
<title>First picture (firstPicture)</title>
<polygon class="gate" points="773,76 870,76 880,100 870,124 773,124 763,100"/>
<text class="label" text-anchor="middle"><tspan x="821" y="97">First picture</tspan></text>
<text class="caption" x="821" y="112" text-anchor="middle" font-size="11">0 of 2</text>
</g>
</svg>