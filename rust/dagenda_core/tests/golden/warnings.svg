.dagenda.dark .canvas { fill: #1a1917; }
.dagenda.dark text { fill: #ecebe8; }
.dagenda.dark .branch { fill: #232220; stroke: #302e2a; }
.dagenda.dark .branch.hue-0, .dagenda.dark .banner.hue-0 rect { fill: #1c2826; stroke: #2b4a45; }
