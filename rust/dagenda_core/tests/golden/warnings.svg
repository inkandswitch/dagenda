  .dagenda:not(.light) .banner.hue-0 text { fill: #a8dcd3; }
  .dagenda:not(.light) .branch.hue-1, .dagenda:not(.light) .banner.hue-1 rect { fill: #1f2130; stroke: #333b63; }
