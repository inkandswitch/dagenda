<svg xmlns="http://www.w3.org/2000/svg" class="dagenda tech-tree" viewBox="0 0 295 373" width="295" height="373" font-family="system-ui, sans-serif" font-size="13">
<style>
.dagenda .canvas { fill: #fff; }
.dagenda text { fill: #1d1c1a; }
.dagenda .title { font-size: 18px; font-weight: 650; }
.dagenda .band { fill: #f6f5f2; }
.dagenda .odd .band { fill: #efede8; }
.dagenda .heading { fill: #6b6760; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
.dagenda .edge { fill: none; stroke: #9a958c; stroke-width: 1.5; }
.dagenda .edge.met { stroke: #6aa56f; }
.dagenda .edge.wanted { stroke-dasharray: 5 4; }
.dagenda .arrow { fill: #9a958c; }
.dagenda .card { fill: #fff; stroke: #c9c4bb; stroke-width: 1.25; }
.dagenda .box { fill: #fff; stroke: #8a857c; stroke-width: 1.25; }
.dagenda .mark { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; }
.dagenda .caption { fill: #6b6760; }
.dagenda .done .card { fill: #edf6ed; stroke: #6aa56f; }
.dagenda .done .box { fill: #6aa56f; stroke: #6aa56f; }
.dagenda .done .mark { fill: #fff; }
.dagenda .in-progress .card { stroke: #2f6fd6; stroke-width: 2; }
.dagenda .in-progress .mark { fill: #2f6fd6; }
.dagenda .needs-attention .card { fill: #fdeeee; stroke: #d33; stroke-width: 2; }
.dagenda .needs-attention .mark { fill: #d33; }
.dagenda .idea .card { stroke-dasharray: 5 3; }
.dagenda .research .card { stroke: #8a5cc8; stroke-dasharray: 2 3; stroke-width: 1.75; }
.dagenda .research .mark { fill: #8a5cc8; }
.dagenda .deferred { opacity: 0.6; }
.dagenda .dropped { opacity: 0.45; }
.dagenda .dropped .label { text-decoration: line-through; }
.dagenda .gate { fill: #fff8e1; stroke: #c9a227; stroke-width: 1.75; }
.dagenda .milestone .label { font-weight: 650; }
.dagenda .reached .gate { fill: #f3d36b; stroke: #a8841a; }
@media (prefers-color-scheme: dark) {
  .dagenda:not(.light) .canvas { fill: #1a1917; }
  .dagenda:not(.light) text { fill: #ecebe8; }
  .dagenda:not(.light) .band { fill: #23221f; }
  .dagenda:not(.light) .odd .band { fill: #2a2925; }
  .dagenda:not(.light) .heading, .dagenda:not(.light) .caption { fill: #9a958c; }
  .dagenda:not(.light) :is(.card, .box) { fill: #1f1e1c; stroke: #5b574f; }
  .dagenda:not(.light) .done .card { fill: #1f2e20; stroke: #6aa56f; }
  .dagenda:not(.light) .done .box { fill: #6aa56f; }
  .dagenda:not(.light) .needs-attention .card { fill: #3a1f1f; stroke: #e5615a; }
  .dagenda:not(.light) .gate { fill: #3a3218; stroke: #c9a227; }
  .dagenda:not(.light) .reached .gate { fill: #8a6d16; }
}
.dagenda.dark .canvas { fill: #1a1917; }
.dagenda.dark text { fill: #ecebe8; }
.dagenda.dark .band { fill: #23221f; }
.dagenda.dark .odd .band { fill: #2a2925; }
.dagenda.dark .heading, .dagenda.dark .caption { fill: #9a958c; }
.dagenda.dark :is(.card, .box) { fill: #1f1e1c; stroke: #5b574f; }
.dagenda.dark .done .card { fill: #1f2e20; stroke: #6aa56f; }
.dagenda.dark .done .box { fill: #6aa56f; }
.dagenda.dark .needs-attention .card { fill: #3a1f1f; stroke: #e5615a; }
.dagenda.dark .gate { fill: #3a3218; stroke: #c9a227; }
.dagenda.dark .reached .gate { fill: #8a6d16; }
</style>
<defs><marker id="dagenda-arrow" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="canvas" width="295" height="373"/>
<text class="title" x="16" y="34">Every warning</text>
<g class="lane even" data-lane="0"><rect class="band" x="0" y="50" width="295" height="86"/><text class="heading" x="16" y="67">Milestones</text></g>
<g class="lane odd" data-lane="1" data-track="work"><rect class="band" x="0" y="142" width="295" height="215"/><text class="heading" x="16" y="159">Work</text></g>
<path class="edge waiting" data-from="unfinished" data-to="shipped" d="M120,184 C160,184 145,184 185,184" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting wanted" data-from="unfinished" data-to="empty" d="M120,184 C160,184 -30,100 10,100" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting" data-from="dropped" data-to="waiting" d="M105,227 C145,227 145,227 185,227" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting" data-from="dropped" data-to="stuck" d="M105,227 C145,227 145,100 185,100" marker-end="url(#dagenda-arrow)"/>
<path class="edge waiting" data-from="deferred" data-to="stuck" d="M108,270 C148,270 145,100 185,100" marker-end="url(#dagenda-arrow)"/>
<g class="node task done" data-id="shipped" data-status="done">
<title>Shipped (shipped): done</title>
<rect class="card" x="191" y="168" width="88" height="33" rx="6"/>
<rect class="box" x="201" y="179" width="12" height="12" rx="2"/>
<text class="mark" x="207" y="189" text-anchor="middle">x</text>
<text class="label" text-anchor="start"><tspan x="220" y="189">Shipped</tspan></text>
</g>
<g class="node task not-started" data-id="unfinished" data-status="not-started">
<title>Unfinished (unfinished): not started</title>
<rect class="card" x="16" y="168" width="104" height="33" rx="6"/>
<rect class="box" x="26" y="179" width="12" height="12" rx="2"/>
<text class="label" text-anchor="start"><tspan x="45" y="189">Unfinished</tspan></text>
</g>
<g class="node task dropped" data-id="dropped" data-status="dropped">
<title>Dropped (dropped): dropped</title>
<rect class="card" x="16" y="211" width="89" height="33" rx="6"/>
<rect class="box" x="26" y="222" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="232" text-anchor="middle">~</text>
<text class="label" text-anchor="start"><tspan x="45" y="232">Dropped</tspan></text>
</g>
<g class="node task deferred" data-id="deferred" data-status="deferred">
<title>Deferred (deferred): deferred</title>
<rect class="card" x="16" y="254" width="92" height="33" rx="6"/>
<rect class="box" x="26" y="265" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="275" text-anchor="middle">&gt;</text>
<text class="label" text-anchor="start"><tspan x="45" y="275">Deferred</tspan></text>
</g>
<g class="node task not-started" data-id="waiting" data-status="not-started">
<title>Waiting (waiting): not started</title>
<rect class="card" x="191" y="211" width="85" height="33" rx="6"/>
<rect class="box" x="201" y="222" width="12" height="12" rx="2"/>
<text class="label" text-anchor="start"><tspan x="220" y="232">Waiting</tspan></text>
</g>
<g class="node task done" data-id="parent" data-status="done">
<title>Parent (parent): done</title>
<rect class="card" x="16" y="297" width="119" height="48" rx="6"/>
<rect class="box" x="26" y="308" width="12" height="12" rx="2"/>
<text class="mark" x="32" y="318" text-anchor="middle">x</text>
<text class="label" text-anchor="start"><tspan x="45" y="318">Parent</tspan></text>
<text class="caption" x="45" y="333" text-anchor="start" font-size="11">1 of 3 subtasks</text>
</g>
<g class="node milestone" data-id="stuck">
<title>Stuck (stuck)</title>
<polygon class="gate" points="201,76 257,76 267,100 257,124 201,124 191,100"/>
<text class="label" text-anchor="middle"><tspan x="229" y="97">Stuck</tspan></text>
<text class="caption" x="229" y="112" text-anchor="middle" font-size="11">0 of 2</text>
</g>
<g class="node milestone reached" data-id="empty">
<title>Empty (empty)</title>
<polygon class="gate" points="26,76 88,76 98,100 88,124 26,124 16,100"/>
<text class="label" text-anchor="middle"><tspan x="57" y="97">Empty</tspan></text>
<text class="caption" x="57" y="112" text-anchor="middle" font-size="11">reached</text>
</g>
</svg>