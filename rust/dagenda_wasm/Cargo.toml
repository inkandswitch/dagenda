[package]
name = "dagenda_wasm"
version = "0.1.0"
description = "Wasm/JavaScript bindings for dagenda roadmaps"
publish = false

authors.workspace = true
categories = ["visualization", "wasm"]
edition.workspace = true
keywords = ["dag", "planning", "roadmap", "wasm"]
license.workspace = true
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dagenda_core = { workspace = true }
wasm-bindgen = { workspace = true, features = ["std"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-reference-types"]

[lints]
workspace = true
